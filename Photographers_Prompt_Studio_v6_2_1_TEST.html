d9b985;background:#e8c796;color:#17191e}.btn.ghost{background:transparent;border-color:var(--edge)}.btn.small{padding:7px 10px;font-size:12px;min-height:32px}.drawer{width:min(355px,90vw);background:#1b1e25;border-left:1px solid #383b46;overflow-y:auto;padding:18px;position:relative;flex-shrink:0}.drawer.hide{display:none}.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.panel-header h2{font-size:18px;letter-spacing:-.3px;font-weight:650;margin:0}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin:5px 0 15px}.divider{height:1px;background:var(--edge);margin:17px 0}.group{margin-bottom:15px}.group label{display:block;color:#c4c6cf;font-size:12px;margin-bottom:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.stack{display:flex;flex-direction:column;gap:9px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tile{border:1px solid var(--edge);background:#232630;border-radius:11px;padding:11px 5px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:11px}.tile.active{border-color:#d8be93;color:#f6d59f;background:#3b352e}.tile svg{width:19px;height:19px}.sliderrow{margin:15px 0}.sliderrow .row{font-size:12px}.sliderrow output{font-variant-numeric:tabular-nums;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}select,input[type=text],input[type=color],.field{width:100%;background:#12151b;color:var(--text);border:1px solid var(--edge);border-radius:9px;padding:10px}textarea.field{min-height:86px;resize:vertical}small,.hint{font-size:11px;color:var(--muted);line-height:1.45}.chip{font-size:10px;border:1px solid #52565f;border-radius:15px;padding:4px 8px;color:#c7c9d2}.status{font-size:11px;color:var(--green)}.selection{display:flex;flex-wrap:wrap;gap:6px}.selection button{background:#252832;border:1px solid #3b404a;border-radius:20px;padding:7px 10px;font-size:12px}.selection button.active{backgr mary{padding:9px 11px}canvas{max-height:calc(100dvh - 255px)}}

/* v6.2: integrated reference/prompt tools: same canvas and drawer */
.drawer .grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.drawer .grid-two label{display:flex;align-items:center;gap:7px;font-size:12px;background:#292c34;border:1px solid #414651;padding:10px;border-radius:10px}
.drawer textarea{width:100%;min-height:88px;resize:vertical;color:#f1ece5;background:#17191f;border:1px solid #434853;border-radius:10px;padding:11px;line-height:1.45}
.drawer .compact-tabs{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.drawer .compact-tabs button{border:1px solid #484b52;border-radius:9px;background:#292d35;color:#e5ded3;padding:8px 10px;font-size:12px}
.drawer .compact-tabs button.on{background:#b99d79;color:#17191f}
.drawer .section-head{font-size:13px;font-weight:700;margin:14px 0 7px;color:#e9e1d2}
.drawer .film-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.drawer .film-opt{border-radius:10px;border:2px solid #484b52;background:#262932;padding:5px;color:#e5dcd0;font-size:11px;text-align:left}
.drawer .film-opt.selected{border-color:#e6b97e}
.drawer .film-opt img{width:100%;height:86px;object-fit:cover;border-radius:7px;display:block;margin-bottom:5px}
.drawer .small-note{font-size:11px;color:#b6b7bd;line-height:1.5;margin:7px 0}
.drawer .status-pill{display:inline-flex;border-radius:99px;border:1px solid #636970;padding:5px 9px;font-size:11px;color:#d9d1c9}
.drawer .status-pill.good{border-color:#62b58a;color:#8bd7aa}
.drawer .status-pill.wait{border-color:#bb9968;color:#e6c58c}
.drawer button.btn{margin-top:7px}
.modal-inner{max-width:650px}
@media(min-width:1000px){.drawer{width:400px}}

function paintSegment(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),steps=Math.max(1,Math.ceil(d/Math.max(2,brushSize*.22)));for(let i=1;i<=steps;i++){const p=i/steps;stamp({x:a.x+(b.x-a.x)*p,y:a.y+(b.y-a.y)*p,pressure:a.pressure+(b.pressure-a.pressure)*p})}render()}

function promptText(){const sections=[];const instructions=$('promptInput').value.trim();
sections.push(model==='Qwen Image Edit 2511'?'Edit the photograph supplied on the canvas. Make only the requested changes while retaining all protected source details.':'Create a photographic image using these source details and desired changes, with realistic spatial coherence.');
if(sceneDescription.trim())sections.push('REFERENCE DESCRIPTION (reviewed by user):\n'+sceneDescription.trim());
if(instructions)sections.push('REQUESTED CHANGE / CREATIVE DIRECTION:\n'+instructions);
const allFields=Object.entries(referenceFields).filter(([k,v])=>v.trim()&&v.trim().toUpperCase()!=='UNCHANGED');
if(allFields.length)sections.push('SPECIFIC SCENE CHANGES:\n'+allFields.map(([k,v])=>k+': '+v).join('\n'));
const held=Object.keys(locks).filter(k=>locks[k]);
if(held.length)sections.push('PRESERVE UNLESS EXPLICITLY CHANGED:\n'+held.join(', ')+'.');
const direct=Object.entries(camera).filter(([k,v])=>v!=='Original').map(([k,v])=>k+': '+v);
if(customCamera.trim())direct.push('Custom camera: '+customCamera.trim());if(customLighting.trim())direct.push('Custom lighting: '+customLighting.trim());
if(direct.length)sections.push('PHOTOGRAPHIC DIRECTION:\n'+direct.join('; ')+'.');
if(style!=='Original')sections.push('ARTISTIC TRANSFORMATION:\nInterpret the provided photograph through the visual techniques of '+style+'. Adapt color, brushwork and visual rendering to the selected style. Remove photographic-rendering terms that conflict with a painterly result. Preserve the underlying subject and scene as closely as possible.');
else sections.push('Natural matte/satin textures, fine realistic detail, believable fabric, coherent light and anatomy.');
if(memory){const changes=Object.entries(settings).filter(([k,v])=>v!==0).map(([k,v])=>k+' '+(v>0?'increased':'decreased'));
if(changes.length)sections.push('CREATIVE MEMORY PREFERENCES:\n'+changes.join(', ')+'.');}
return sections.join('\n\n');}
